[pytest]
# Pytest configuration for plugin-adapter testing framework

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Test execution
addopts = 
    --verbose
    --tb=short
    --strict-config
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80

# Markers for test categorization
markers =
    unit: Unit tests - fast, isolated tests for individual components
    integration: Integration tests - tests for component interactions
    e2e: End-to-end tests - full workflow tests
    performance: Performance and load tests
    slow: Slow running tests (skip with -m "not slow")
    network: Tests that require network connectivity
    mock: Tests that use mocking
    real: Tests that use real external services
    smoke: Smoke tests for basic functionality
    regression: Regression tests
    critical: Critical path tests that must pass

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning

# Timeout for individual tests (in seconds)
timeout = 30

# Parallel execution (if pytest-xdist is installed)
# xdist_workers = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test output
junit_family = xunit2

# Minimum Python version
minversion = 6.0